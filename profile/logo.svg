<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="cool" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="55%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#88A98E"/>
    </linearGradient>
    <linearGradient id="warm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B4A"/>
      <stop offset="100%" stop-color="#FFB347"/>
    </linearGradient>
  </defs>
  <!-- Studio Badge Background -->
  <rect width="120" height="120" rx="26" fill="#0F172A"/>
  <!-- Concentric Radar/Compass Rings -->
  <circle cx="60" cy="60" r="49" fill="none" stroke="#38BDF8" stroke-width="0.9" stroke-opacity="0.22"/>
  <circle cx="60" cy="60" r="41" fill="none" stroke="#10B981" stroke-width="1.3" stroke-opacity="0.32"/>
  <circle cx="60" cy="60" r="33" fill="none" stroke="#06B6D4" stroke-width="1.6" stroke-opacity="0.48"/>
  <!-- Cardinal Ticks -->
  <line x1="60" y1="8" x2="60" y2="14" stroke="#38BDF8" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.55"/>
  <line x1="60" y1="106" x2="60" y2="112" stroke="#38BDF8" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.55"/>
  <line x1="8" y1="60" x2="14" y2="60" stroke="#38BDF8" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.55"/>
  <line x1="106" y1="60" x2="112" y2="60" stroke="#38BDF8" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.55"/>
  <!-- Left/Lower Link Loop (Sky -> Sage) -->
  <path d="M52 76 H39 A16 16 0 0 1 39 44 H54" fill="none" stroke="url(#cool)" stroke-width="6.5" stroke-linecap="round"/>
  <!-- Right/Upper Link Loop (Flock Coral -> Amber) -->
  <path d="M68 44 H81 A16 16 0 0 1 81 76 H66" fill="none" stroke="url(#warm)" stroke-width="6.5" stroke-linecap="round"/>
  <!-- Central Sotto Harmonic Bars -->
  <line x1="52" y1="54" x2="52" y2="66" stroke="#FAF9F5" stroke-width="4" stroke-linecap="round"/>
  <line x1="60" y1="48" x2="60" y2="72" stroke="#FAF9F5" stroke-width="4.2" stroke-linecap="round"/>
  <line x1="68" y1="54" x2="68" y2="66" stroke="#FAF9F5" stroke-width="4" stroke-linecap="round"/>
</svg>
